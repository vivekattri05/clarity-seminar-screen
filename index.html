<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style><meta name="robots" content="noindex,nofollow"></head><body>
<title>Seminar Screen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Outfit:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* layout: a projector stage — one big element (timer, QR, or both side by side) on HSIM navy, with a control dock that hides itself while presenting */
:root{
  --bg:#050E1F; --panel:#0B1C35; --ink:#FFFFFF; --mut:#9DB2CC; --line:rgba(127,219,255,.18);
  --blue:#1A7AC8; --cyan:#12A6DA; --ice:#7FDBFF; --pink:#E6238A; --ok:#3EE08F;
  --f-head:"Sora",system-ui,sans-serif; --f-body:"Outfit",system-ui,sans-serif; --f-num:"IBM Plex Sans Condensed","Outfit",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow-x:hidden}
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#0D3566 0%,#071A36 50%,var(--bg) 100%)}
.bgfx i{position:absolute;border-radius:50%;filter:blur(110px);opacity:.45}
.bgfx .b1{width:60vw;height:60vw;background:var(--blue);left:-20vw;top:-10vw;animation:d1 20s ease-in-out infinite alternate}
.bgfx .b2{width:50vw;height:50vw;background:var(--pink);right:-18vw;bottom:-20vw;opacity:.28;animation:d2 24s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(12vw,8vw) scale(1.1)}} @keyframes d2{to{transform:translate(-10vw,-6vw) scale(1.1)}}
.stage{min-height:100%;display:flex;flex-direction:column;padding-block:clamp(14px,3vh,34px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{background:#fff;border-radius:14px;padding:8px 16px;display:flex}
.logo img{height:clamp(30px,5vh,52px);width:auto;display:block}
.event{font:600 clamp(13px,1.6vw,20px)/1.2 var(--f-num);letter-spacing:.22em;color:var(--ice);text-transform:uppercase;text-align:right}
.main{flex:1;display:grid;place-items:center;padding-block:2vh}
.both{display:grid;grid-template-columns:1.25fr 1fr;gap:5vw;align-items:center;width:100%;max-width:1600px}
.headline{font:800 clamp(24px,4.2vw,64px)/1.08 var(--f-head);letter-spacing:-.02em;text-align:center;text-wrap:balance}
.sub{font:500 clamp(14px,1.8vw,26px)/1.35 var(--f-body);color:var(--mut);text-align:center;margin-top:1.2vh;text-wrap:balance}
/* timer */
.timer{display:flex;flex-direction:column;align-items:center;gap:2vh}
.ringwrap{position:relative;width:min(68vh,78vw);aspect-ratio:1;max-width:100%}
.both .ringwrap{width:min(58vh,40vw)}
.ringwrap svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap circle{fill:none;stroke-width:16}
.ringwrap .tr{stroke:rgba(255,255,255,.08)}
.ringwrap .pr{stroke:url(#tg);stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.clock{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.clock b{display:block;font:800 clamp(56px,13vh,190px)/1 var(--f-head);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.both .clock b{font-size:clamp(48px,11vh,150px)}
.clock small{display:block;font:600 clamp(12px,1.6vh,20px)/1 var(--f-num);letter-spacing:.24em;color:var(--ice);margin-top:1.4vh}
.timer.warn .clock b{color:var(--pink);animation:pulse 1s ease-in-out infinite}
.timer.warn .pr{stroke:var(--pink)}
.timer.over .clock b{color:var(--pink)}
@keyframes pulse{50%{transform:scale(1.04)}}
/* qr */
.qr{display:flex;flex-direction:column;align-items:center;gap:2.2vh}
.qrbox{background:#fff;border-radius:24px;padding:clamp(12px,2vh,26px);box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 6px rgba(127,219,255,.25);animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 10px rgba(127,219,255,.45)}}
.qrbox canvas,.qrbox img{display:block;width:min(52vh,70vw);height:auto;max-width:100%;image-rendering:pixelated}
.both .qrbox canvas,.both .qrbox img{width:min(48vh,34vw)}
.qrlabel{font:700 clamp(18px,2.6vw,40px)/1.15 var(--f-head);text-align:center}
.qrurl{font:600 clamp(12px,1.4vw,20px)/1 var(--f-num);letter-spacing:.06em;color:var(--ice);text-align:center;word-break:break-all}
.qrc canvas{display:block!important}.qrc img{display:none!important}
.qrwait{width:min(48vh,34vw);aspect-ratio:1;border:3px dashed rgba(127,219,255,.45);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center;padding:3vh}
.qrwait i{font:800 clamp(44px,9vh,120px)/1 var(--f-head);color:var(--ice);font-style:normal}
.qrwait b{font:700 clamp(18px,2.4vw,34px)/1.2 var(--f-head)}
.qrwait span{font:500 clamp(13px,1.5vw,22px)/1.35 var(--f-body);color:var(--mut)}
.qrwait.closed{border-color:rgba(230,35,138,.6)}.qrwait.closed i{color:var(--pink)}
.empty{border:2px dashed var(--line);border-radius:24px;padding:6vh 4vw;text-align:center;color:var(--mut);max-width:560px}
/* dock */
.dock{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;background:rgba(11,28,53,.92);border:1px solid var(--line);border-radius:16px;padding:8px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .4s,transform .4s;z-index:20;max-width:calc(100vw - 32px)}
.dock.hide{opacity:0;transform:translate(-50%,20px);pointer-events:none}
.dock .grp{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.dock .sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
button,.btn{font:600 13px/1 var(--f-body);color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
button:hover{background:rgba(255,255,255,.12)}
button.on{background:var(--blue);border-color:var(--blue)}
button.go{background:linear-gradient(90deg,var(--blue),var(--cyan));border-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
[hidden]{display:none!important}
/* settings */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(3,8,18,.72);display:grid;place-items:center;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(680px,100%);max-height:90vh;overflow:auto;box-sizing:border-box}
.card h2{font:700 20px/1.2 var(--f-head)}
.card p{color:var(--mut);margin-top:6px;line-height:1.5}
.slot{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;align-items:center;margin-top:14px}
.slot label{font:600 13px/1.2 var(--f-body)}
.slot input[type=text],.slot input[type=url],.slot input[type=number]{width:100%;box-sizing:border-box;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:400 14px/1.3 var(--f-body)}
.slot .hint{grid-column:2;font-size:12px;color:var(--mut)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
@media (max-width:760px){
  .both{grid-template-columns:1fr;gap:4vh}
  .both .ringwrap{width:min(60vw,46vh)} .both .qrbox canvas,.both .qrbox img{width:min(60vw,40vh)}
  .slot{grid-template-columns:1fr} .slot .hint{grid-column:1}
  .event{text-align:left}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const DEFAULT_LINKS={test:'https://forms.gle/7qgnng1jP59JBxQL9',prac:'https://forms.gle/9biSBJZfbccBpH2M6',intent:'https://forms.gle/83wq3xG6qYvDb7q7A',feed:'https://forms.gle/1yrAnqQTno2NffGC7'};
const SLOTS=[
  {k:'test',name:'Test',label:'Scan to start the Clarity Test',sub:'20 questions · 20 minutes · use the name and mobile number you registered with'},
  {k:'prac',name:'Practical',label:'Scan to submit your practical',sub:'Text, ad copy, or a link to your image or landing page'},
  {k:'intent',name:'Intent',label:'Scan for the Seat Interest Form',sub:'Want to join the course? It takes 1 minute'},
  {k:'feed',name:'Feedback',label:'Scan to share your feedback',sub:'1 minute · your feedback makes the next seminar better'}
];
const MODES=[['timer','Timer'],['qr','QR'],['both','Timer + QR']];
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem('hsim-screen-'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('hsim-screen-'+k,JSON.stringify(v));}catch(e){}}};
let mode=store.get('mode','both'), slot=store.get('slot','test'); if(!SLOTS.some(x=>x.k===slot)) slot='test'; let links=Object.assign({},DEFAULT_LINKS,Object.fromEntries(Object.entries(store.get('links',{})).filter(([k,v])=>v)));
let total=store.get('min',20)*60, left=total, running=false, endAt=0, tick=null, beeped=false;

function fmt(s){ const neg=s<0; s=Math.abs(Math.round(s)); const m=Math.floor(s/60), x=s%60; return (neg?'+':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'); }
function timerEl(){
  const w=document.createElement('div'); w.className='timer'; w.id='timer';
  const r=document.createElement('div'); r.className='ringwrap';
  r.innerHTML='<svg viewBox="0 0 400 400"><circle class="tr" cx="200" cy="200" r="180"/><circle class="pr" id="arc" cx="200" cy="200" r="180" stroke-dasharray="1131" stroke-dashoffset="0"/></svg>';
  const c=document.createElement('div'); c.className='clock'; const b=document.createElement('b'); b.id='clock'; const sm=document.createElement('small'); sm.id='clockLabel'; const inner=document.createElement('div'); inner.append(b,sm); c.append(inner); r.append(c); w.append(r);
  return w;
}
function qrState(){ const now=running?(endAt-Date.now())/1000:left; if(now<=0) return 'closed'; if(!running && now>=total) return 'wait'; return 'open'; }
let lastQr=null;
function qrLocked(st){
  const s=SLOTS.find(x=>x.k===slot); const w=document.createElement('div'); w.className='qr';
  const l=document.createElement('div'); l.className='qrlabel'; l.textContent = st==='wait' ? s.label.replace(/^Scan to /,'Get ready to ') : 'Time is up';
  const box=document.createElement('div'); box.className='qrwait'+(st==='closed'?' closed':'');
  const i=document.createElement('i'); i.textContent = st==='wait' ? '⏳' : '■';
  const b=document.createElement('b'); b.textContent = st==='wait' ? 'The QR code appears when the timer starts' : 'This QR is now closed';
  const sp=document.createElement('span'); sp.textContent = st==='wait' ? 'Keep your phone camera ready' : 'Submit now if you have not already';
  box.append(i,b,sp); w.append(l,box); return w;
}
function qrEl(){
  const s=SLOTS.find(x=>x.k===slot); const w=document.createElement('div'); w.className='qr';
  const link=(links[slot]||'').trim();
  if(/^https?:\/\//i.test(link) && window.QRCode){
    const box=document.createElement('div'); box.className='qrbox'; const holder=document.createElement('div'); holder.className='qrc'; box.append(holder); w.append(box);
    new QRCode(holder,{text:link,width:720,height:720,colorDark:'#0A2747',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
    const u=document.createElement('div'); u.className='qrurl'; u.textContent=link.replace(/^https?:\/\//,''); w.append(u);
  } else {
    const e=document.createElement('div'); e.className='empty'; e.textContent = (window.QRCode ? 'No '+s.name+' link yet. Paste it under "⚙ Links".' : 'The QR tool did not load. Check the internet and reopen the page.'); w.append(e);
  }
  const l=document.createElement('div'); l.className='qrlabel'; l.textContent=s.label; const sb=document.createElement('div'); sb.className='sub'; sb.textContent=s.sub;
  w.prepend(l); w.append(sb);
  return w;
}
function render(){
  const m=$('main'); m.textContent='';
  if(mode==='timer'){ const t=timerEl(); const h=document.createElement('div'); h.style.textAlign='center'; const hl=document.createElement('div'); hl.className='headline'; hl.textContent=slot==='test'?'Clarity Test':'Time'; t.prepend(hl); m.append(t); }
  else if(mode==='qr'){ m.append(qrEl()); }
  else { lastQr=qrState(); const g=document.createElement('div'); g.className='both'; g.append(timerEl(), lastQr==='open'?qrEl():qrLocked(lastQr)); m.append(g); }
  $('modes').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
  $('slots').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===slot));
  paint();
}
function paint(){
  const now=running?(endAt-Date.now())/1000:left;
  if(mode==='both' && lastQr!==null && qrState()!==lastQr){ render(); return; }
  const c=$('clock'); if(!c){ musSync(); return; }
  c.textContent=fmt(Math.ceil(now));
  $('clockLabel').textContent = now<=0 ? 'TIME UP' : running ? 'REMAINING' : (now===total?'READY':'PAUSED');
  const frac=Math.max(0,Math.min(1,now/total)); $('arc').setAttribute('stroke-dashoffset',(1131*(1-frac)).toFixed(1));
  const t=$('timer'); t.classList.toggle('warn',now>0&&now<=60); t.classList.toggle('over',now<=0);
  if(now<=0 && running && !beeped){ beeped=true; beep(); }
  $('b-start').textContent = running ? '❚❚ Pause' : '▶ Start';
  musSync();
}
let actx=null;
function beep(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); [0,.35,.7].forEach(d=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; o.connect(g); g.connect(actx.destination); const t=actx.currentTime+d; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.4,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.3); o.start(t); o.stop(t+.32); }); }catch(e){} }

// background music: soft generated loop (no file needed), plays only while the timer runs
const MUS_LV=[['High',2.0],['Medium',0.9],['Off',0]]; let musLv=store.get('muslv',0); if(!(musLv>=0&&musLv<3)) musLv=0; let musicOn=MUS_LV[musLv][1]>0, mus=null;
const CHORDS=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]]; // Am F C G
const hz=n=>440*Math.pow(2,(n-69)/12);
function musStart(){
  if(!musicOn||mus) return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){ return; }
  const master=actx.createGain(); master.gain.setValueAtTime(0.0001,actx.currentTime); master.gain.exponentialRampToValueAtTime(MUS_LV[musLv][1],actx.currentTime+1.5);
  const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3200; const comp=actx.createDynamicsCompressor(); comp.threshold.value=-12; comp.ratio.value=6; comp.attack.value=0.01; comp.release.value=0.3; master.connect(lp); lp.connect(comp); comp.connect(actx.destination);
  mus={master,step:0,next:actx.currentTime+0.1,timer:null};
  const BAR=4.8, STEP=BAR/8;
  function note(f,t,dur,vol,type){ const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.value=f; o.connect(g); g.connect(master); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+Math.min(0.8,dur/3)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.start(t); o.stop(t+dur+0.05); }
  function sched(){
    while(mus && mus.next < actx.currentTime+1.2){
      const t=mus.next, i=mus.step, ch=CHORDS[Math.floor(i/8)%4];
      if(i%8===0){ ch.forEach(n=>{ note(hz(n),t,BAR+0.6,0.20,'sine'); note(hz(n)*1.003,t,BAR+0.6,0.12,'triangle'); }); note(hz(ch[0]-12),t,BAR,0.30,'triangle'); }
      const arp=[0,1,2,1,0,2,1,2][i%8]; note(hz(ch[arp]+12),t,0.9,0.16,'triangle');
      mus.step++; mus.next+=STEP;
    }
  }
  sched(); mus.timer=setInterval(sched,200);
}
function musStop(){
  if(!mus) return; const m=mus; mus=null; clearInterval(m.timer);
  try{ const t=actx.currentTime; m.master.gain.cancelScheduledValues(t); m.master.gain.setValueAtTime(Math.max(m.master.gain.value,0.0001),t); m.master.gain.exponentialRampToValueAtTime(0.0001,t+1.2); setTimeout(()=>{ try{m.master.disconnect();}catch(e){} },1500); }catch(e){}
}
function musSync(){ const now=running?(endAt-Date.now())/1000:left; if(musicOn && running && now>0) musStart(); else musStop(); const b=$('b-music'); if(b){ b.textContent='♪ Music: '+MUS_LV[musLv][0]; b.classList.toggle('on',musicOn); } }
function start(){ if(running){ left=(endAt-Date.now())/1000; running=false; clearInterval(tick); } else { try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} endAt=Date.now()+left*1000; running=true; beeped=left<=0; clearInterval(tick); tick=setInterval(paint,250); } paint(); }
function reset(){ running=false; clearInterval(tick); left=total; beeped=false; paint(); }
function setMin(n){ total=n*60; store.set('min',n); reset(); }

// dock
MODES.forEach(([k,t])=>{ const b=document.createElement('button'); b.type='button'; b.textContent=t; b.dataset.m=k; b.onclick=()=>{mode=k; store.set('mode',k); render();}; $('modes').append(b); });
SLOTS.forEach(s=>{ const b=document.createElement('button'); b.type='button'; b.textContent=s.name; b.dataset.k=s.k; b.onclick=()=>{slot=s.k; store.set('slot',s.k); if(mode==='timer'){mode='both';} render();}; $('slots').append(b); });
[5,10,15,20,25].forEach(n=>{ const b=document.createElement('button'); b.type='button'; b.textContent=n+'m'; b.onclick=()=>setMin(n); $('presets').append(b); });
$('b-start').onclick=start; $('b-music').onclick=()=>{ musLv=(musLv+1)%3; store.set('muslv',musLv); musicOn=MUS_LV[musLv][1]>0; musStop(); musSync(); }; $('b-reset').onclick=reset;
$('b-plus').onclick=()=>{ if(running){ endAt+=60000; } else { left+=60; } total=Math.max(total, running?(endAt-Date.now())/1000:left); beeped=false; paint(); };
$('b-full').onclick=()=>{ const d=document.documentElement; if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); else if(d.requestFullscreen) d.requestFullscreen().catch(()=>{}); };
// settings
const sf=$('slotform');
SLOTS.forEach(s=>{
  const d=document.createElement('div'); d.className='slot';
  const l=document.createElement('label'); l.htmlFor='ln-'+s.k; l.textContent=s.name+' link';
  const i=document.createElement('input'); i.type='url'; i.id='ln-'+s.k; i.placeholder='https://forms.gle/…'; i.value=links[s.k]||'';
  i.oninput=()=>{ links[s.k]=i.value.trim(); store.set('links',links); };
  d.append(l,i); sf.append(d);
});
$('custom-min').value=Math.round(total/60);
$('custom-min').onchange=e=>{ const n=parseInt(e.target.value,10); if(n>0&&n<=180) setMin(n); };
$('b-set').onclick=()=>{ $('sheet').hidden=false; };
$('b-close').onclick=()=>{ $('sheet').hidden=true; render(); };
// keyboard + auto-hide dock
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return; if(e.code==='Space'){e.preventDefault();start();} else if(e.key==='r'||e.key==='R') reset(); else if(e.key==='f'||e.key==='F') $('b-full').click(); wake(); });
let idle=null; function wake(){ $('dock').classList.remove('hide'); clearTimeout(idle); idle=setTimeout(()=>{ if($('sheet').hidden) $('dock').classList.add('hide'); },3500); }
['mousemove','touchstart','click'].forEach(ev=>document.addEventListener(ev,wake,{passive:true}));
wake();
if(!['timer','qr','both'].includes(mode)) mode='both';
render();
window.addEventListener('load',()=>{ if(window.QRCode) render(); });
</script>
